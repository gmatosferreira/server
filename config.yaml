# OliveTin Configuration
# Define all actions here - no need to edit HTML or shell server files!

title: "Pentium 4 Server Power Control"
port: 8888
listenAddress: "0.0.0.0"

actions:
  # --- System ---
  - title: System Resources
    shell: >
      free -m | awk '/Mem:/ { printf "RAM:  %dM / %dM (%d%% used, %dM avail)\n", $3, $2, int(($3/$2)*100), ($7?$7:$4) } /Swap:/ { printf "SWAP: %dM / %dM\n", $3, $2 }' && df -h | awk '$6 == "/" { printf "DISK: %s / %s (%s used, %s free)\n", $3, $2, $5, $4 }'
    icon: cpu
    onclick: execution-dialog
    color: "#06b6d4"
    group: System

  - title: Top RAM Processes
    shell: top -b -n 1 -m | awk 'NR==1 { split($2, a, ":"); tot=a[2] } NR > 4 && $1 ~ /^[0-9]+$/ { cmd=""; for(i=9;i<=NF;i++) cmd=cmd (i>9?" ":"") $i; print $4, $1, (tot?tot:1015624), cmd }' | sort -rn | head -n 15 | awk 'BEGIN { printf "%-7s %-12s %-8s %s\n", "PID", "ACTUAL RAM", "% RAM", "COMMAND" } { mb = sprintf("%.1f MB", $1 / 1024); pct = sprintf("%.1f%%", ($1 / $3) * 100); cmd=""; for(i=4;i<=NF;i++) cmd=cmd (i>4?" ":"") $i; printf "%-7s %-12s %-8s %s\n", $2, mb, pct, cmd }'
    icon: memory
    onclick: execution-dialog
    color: "#ec4899"
    group: System

  - title: Services Status
    shell: rc-status
    icon: gear
    onclick: execution-dialog
    color: "#64748b"
    group: System

  - title: Wi-Fi Link
    shell: iw dev wlan0 link
    icon: wifi
    onclick: execution-dialog
    color: "#14b8a6"
    group: Network

  - title: Network Daily
    shell: vnstat -d
    icon: calendar-day
    onclick: execution-dialog
    color: "#0284c7"
    group: Network

  - title: Network Hourly
    shell: vnstat -h
    icon: clock-history
    onclick: execution-dialog
    color: "#0369a1"
    group: Network

  # --- Media ---
  - title: Transmissionic
    url: http://xp:9093/
    icon: magnet
    color: "#6366f1"
    group: Media

  - title: Transmission Web UI
    url: http://xp:9091
    icon: broadcast
    color: "#10b981"
    group: Media

  - title: List Media Files
    shell: ls -lhR /srv/storage/media/
    icon: folder
    onclick: execution-dialog
    color: "#8b5cf6"
    group: Media

  - title: Transmission Status
    shell: rc-service transmission-daemon status
    icon: broadcast
    onclick: execution-dialog
    color: "#10b981"
    group: Media

  - title: Transmission Stats
    shell: transmission-remote localhost:9091 -st
    icon: bar-chart
    onclick: execution-dialog
    color: "#0ea5e9"
    group: Media

  - title: Restart Transmission
    shell: rc-service transmission-daemon restart
    icon: arrow-repeat
    onclick: confirm
    color: "#e11d48"
    group: Media

  - title: Clean Incomplete & Empty Folders
    shell: 'echo "=== 1. Cleaning incomplete contents older than 6h ===" && ( [ -d /srv/storage/media/incomplete ] && find /srv/storage/media/incomplete/ -mindepth 1 -mmin +360 -delete -print 2>/dev/null || true ) && echo "=== 2. Cleaning folders without media ===" && for d in /srv/storage/media/*; do [ -d "$d" ] || continue; [ "$d" = "/srv/storage/media/incomplete" ] && continue; if [ $(find "$d" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.m4v" -o -name "*.mov" \) | wc -l) -eq 0 ]; then echo "Removing non-media folder: $d" && rm -rf "$d"; fi; done && echo "Cleanup complete!"'
    icon: trash
    onclick: execution-dialog
    color: "#e11d48"
    group: Media

  # --- Backrest ---
  - title: Backrest Web UI
    url: http://xp:9898
    icon: cloud-check
    color: "#10b981"
    group: Backrest

  - title: Backrest Status
    shell: rc-service backrest status
    icon: activity
    onclick: execution-dialog
    color: "#0ea5e9"
    group: Backrest

  # --- Power & Maintenance ---
  - title: Restart Server
    shell: reboot
    icon: restart
    onclick: confirm
    color: "#f59e0b"
    group: Power & Maintenance

  - title: Power Off Server
    shell: poweroff
    icon: power
    onclick: confirm
    color: "#dc2626"
    group: Power & Maintenance

  - title: Update & Restart Service
    shell: cd /git/server && git pull && (nohup sh -c "sleep 1; rc-service server-control restart || rc-service p4web restart" >/dev/null 2>&1 &) && echo "Update pulled! Service restarting in 1s..."
    icon: cloud-arrow-down
    onclick: confirm
    color: "#3b82f6"
    group: Power & Maintenance
