# OliveTin Configuration
# Define all actions here - no need to edit HTML or shell server files!

title: "Pentium 4 Server Power Control"
port: 8888
listenAddress: "0.0.0.0"

actions:
  - title: System Resources
    shell: echo "=== MEMORY USAGE (free -m) ===" && free -m && echo "" && echo "=== DISK USAGE (df -h) ===" && df -h
    icon: cpu
    onclick: execution-dialog
    color: "#06b6d4"

  - title: Clean Incomplete & Empty Folders
    shell: 'echo "=== 1. Cleaning incomplete contents older than 6h ===" && ( [ -d /srv/storage/media/incomplete ] && find /srv/storage/media/incomplete/ -mindepth 1 -mmin +360 -delete -print 2>/dev/null || true ) && echo "=== 2. Cleaning folders without media ===" && for d in /srv/storage/media/*; do [ -d "$d" ] || continue; [ "$d" = "/srv/storage/media/incomplete" ] && continue; if [ $(find "$d" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.m4v" -o -name "*.mov" \) | wc -l) -eq 0 ]; then echo "Removing non-media folder: $d" && rm -rf "$d"; fi; done && echo "Cleanup complete!"'
    icon: trash
    onclick: execution-dialog
    color: "#e11d48"

  - title: Transmission Status
    shell: rc-service transmission-daemon status
    icon: broadcast
    onclick: execution-dialog
    color: "#10b981"

  - title: Restart Transmission
    shell: rc-service transmission-daemon restart
    icon: arrow-repeat
    onclick: confirm
    color: "#6366f1"

  - title: Restart Server
    shell: reboot
    icon: restart
    onclick: confirm
    color: "#f59e0b"
    
  - title: Power Off Server
    shell: poweroff
    icon: power
    onclick: confirm
    color: "#dc2626"

  - title: Update & Restart Service
    shell: cd /git/server && git pull && (nohup sh -c "sleep 1; rc-service server-control restart || rc-service p4web restart" >/dev/null 2>&1 &) && echo "Update pulled! Service restarting in 1s..."
    icon: cloud-arrow-down
    onclick: confirm
    color: "#3b82f6"


