<!DOCTYPE html>
<html>

<head>
    <title>P4 Server Power</title>
</head>

<body style="background:#222; color:#fff; font-family:sans-serif; text-align:center; padding-top:50px;">
    <h2>Pentium 4 Server Power Control</h2>
    <form action="/shutdown" method="POST">
        <button
            style="padding:20px 40px; font-size:20px; background:#d9534f; color:#fff; border:none; border-radius:8px; cursor:pointer;"
            onclick="return confirm('Are you sure you want to shut down the server?');">Power Off Server</button>
    </form>
</body>

</html>
