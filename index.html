<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveTin Web Control</title>
    <style>
        :root {
            --bg-color: #121316;
            --card-bg: #1e2025;
            --card-hover: #262830;
            --text-color: #f0f2f5;
            --text-muted: #9aa0a6;
            --border-color: #2e323b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
            --term-bg: #090a0f;
            --term-text: #e2e8f0;
            --term-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .badge {
            background: #232733;
            color: #60a5fa;
            border: 1px solid #3b82f644;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 500;
        }

        main {
            width: 100%;
            max-width: 900px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .action-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .action-card:hover {
            background-color: var(--card-hover);
            border-color: #4b5563;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .action-card:active {
            transform: translateY(0);
        }

        .action-card.danger {
            border-color: #7f1d1d;
        }

        .action-card.danger:hover {
            border-color: var(--danger-color);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-container {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #272a33;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #93c5fd;
        }

        .action-card.danger .icon-container {
            background: #3c191c;
            color: #f87171;
        }

        .icon-container svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .card-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-size: 1.15rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-close-btn:hover {
            color: #fff;
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .terminal-window {
            background: var(--term-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.88rem;
            max-height: 320px;
            overflow-y: auto;
            color: var(--term-text);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .term-meta {
            color: var(--term-muted);
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .term-stderr {
            color: #f87171;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .status-badge.running {
            background: #1e3a5f;
            color: #60a5fa;
        }

        .status-badge.success {
            background: #064e3b;
            color: #34d399;
        }

        .status-badge.failed {
            background: #7f1d1d;
            color: #f87171;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #60a5fa;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: #18191e;
        }

        button.btn {
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        button.btn-secondary {
            background: #2e323b;
            color: var(--text-color);
        }

        button.btn-secondary:hover {
            background: #3f4450;
        }

        button.btn-primary {
            background: var(--accent-color);
            color: #fff;
        }

        button.btn-primary:hover {
            background: var(--accent-hover);
        }

        button.btn-danger {
            background: var(--danger-color);
            color: #fff;
        }

        button.btn-danger:hover {
            background: var(--danger-hover);
        }

        .loading-view {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1 id="page-title">OliveTin Server Control</h1>
            <span class="badge">config.yaml</span>
        </div>
    </header>

    <main>
        <div id="actions-grid" class="grid">
            <div class="loading-view">Loading actions from config.yaml...</div>
        </div>
    </main>

    <!-- Execution Dialog Modal -->
    <div id="exec-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modal-title">Action Execution</h2>
                <button class="modal-close-btn" onclick="closeExecModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div>
                    <span id="exec-status" class="status-badge running">
                        <span class="spinner"></span> Running command...
                    </span>
                </div>
                <div id="term-output" class="terminal-window">
                    <div class="term-meta" id="term-command"></div>
                    <div id="term-content">Executing...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-rerun-btn" class="btn btn-secondary" style="display:none;" onclick="reRunCurrentAction()">Run Again</button>
                <button class="btn btn-primary" onclick="closeExecModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Confirm Dialog Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 440px;">
            <div class="modal-header">
                <h2 id="confirm-title">Confirm Action</h2>
                <button class="modal-close-btn" onclick="closeConfirmModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirm-message" style="color: var(--text-color); font-size: 1rem; line-height: 1.5;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
                <button id="confirm-proceed-btn" class="btn btn-danger">Confirm & Execute</button>
            </div>
        </div>
    </div>

    <script>
        // Built-in inline SVG icon library for offline LAN use
        const ICONS = {
            smile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
            power: `<svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>`,
            terminal: `<svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>`,
            restart: `<svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            server: `<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>`,
            trash: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`
        };

        let currentActions = [];
        let activeActionId = null;

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                if (!res.ok) throw new Error('Failed to load configuration');
                const data = await res.json();
                
                document.getElementById('page-title').textContent = data.title || 'OliveTin Server Control';
                document.title = data.title || 'OliveTin Server Control';

                currentActions = data.actions || [];
                renderActions(currentActions);
            } catch (err) {
                document.getElementById('actions-grid').innerHTML = `
                    <div class="loading-view" style="color: #f87171;">
                        Could not load configuration from server.<br>
                        <small style="color: var(--text-muted);">${err.message}</small>
                    </div>
                `;
            }
        }

        function getIconSvg(iconName) {
            const key = (iconName || 'terminal').toLowerCase().trim();
            return ICONS[key] || ICONS['terminal'];
        }

        function renderActions(actions) {
            const container = document.getElementById('actions-grid');
            if (!actions || actions.length === 0) {
                container.innerHTML = '<div class="loading-view">No actions configured in config.yaml.</div>';
                return;
            }

            container.innerHTML = actions.map(act => {
                const isDanger = act.icon === 'power' || act.title.toLowerCase().includes('shutdown') || act.title.toLowerCase().includes('power off');
                return `
                    <div class="action-card ${isDanger ? 'danger' : ''}" onclick="handleActionClick(${act.id})">
                        <div class="card-top">
                            <div class="icon-container">
                                ${getIconSvg(act.icon)}
                            </div>
                            <div class="card-info">
                                <h3>${escapeHtml(act.title)}</h3>
                                ${act.description ? `<p>${escapeHtml(act.description)}</p>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleActionClick(actionId) {
            const act = currentActions.find(a => a.id === actionId);
            if (!act) return;

            activeActionId = actionId;

            if (act.onclick === 'confirm') {
                showConfirmModal(act);
            } else {
                // Default: execution-dialog
                executeActionWithDialog(act);
            }
        }

        function showConfirmModal(act) {
            document.getElementById('confirm-title').textContent = act.title;
            document.getElementById('confirm-message').textContent = `Are you sure you want to execute "${act.title}"?`;
            
            const proceedBtn = document.getElementById('confirm-proceed-btn');
            proceedBtn.onclick = () => {
                closeConfirmModal();
                executeActionWithDialog(act);
            };

            document.getElementById('confirm-modal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('active');
        }

        function closeExecModal() {
            document.getElementById('exec-modal').classList.remove('active');
        }

        function reRunCurrentAction() {
            if (activeActionId !== null) {
                const act = currentActions.find(a => a.id === activeActionId);
                if (act) executeActionWithDialog(act);
            }
        }

        async function executeActionWithDialog(act) {
            const modal = document.getElementById('exec-modal');
            const titleEl = document.getElementById('modal-title');
            const statusEl = document.getElementById('exec-status');
            const cmdEl = document.getElementById('term-command');
            const contentEl = document.getElementById('term-content');
            const rerunBtn = document.getElementById('modal-rerun-btn');

            titleEl.textContent = act.title;
            statusEl.className = 'status-badge running';
            statusEl.innerHTML = '<span class="spinner"></span> Running command...';
            cmdEl.textContent = `Action: ${act.title}`;
            contentEl.textContent = 'Waiting for process to finish...';
            rerunBtn.style.display = 'none';

            modal.classList.add('active');

            try {
                const res = await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: act.id })
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || 'Server error');
                }

                const result = await res.json();
                
                if (result.success) {
                    statusEl.className = 'status-badge success';
                    statusEl.textContent = `✓ Finished (exit code 0 in ${result.duration}s)`;
                } else {
                    statusEl.className = 'status-badge failed';
                    statusEl.textContent = `✗ Failed (exit code ${result.exit_code} in ${result.duration}s)`;
                }

                let outputText = '';
                if (result.stdout) outputText += result.stdout;
                if (result.stderr) {
                    if (outputText) outputText += '\n';
                    outputText += `[stderr]\n${result.stderr}`;
                }
                if (!outputText.trim()) {
                    outputText = '(Command completed with no output)';
                }

                contentEl.textContent = outputText;
                rerunBtn.style.display = 'inline-block';
            } catch (err) {
                statusEl.className = 'status-badge failed';
                statusEl.textContent = '✗ Execution Request Failed';
                contentEl.textContent = `Error communicating with server: ${err.message}`;
                rerunBtn.style.display = 'inline-block';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Close on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeExecModal();
                closeConfirmModal();
            }
        });

        // Initialize on load
        loadConfig();
    </script>
</body>
</html>
